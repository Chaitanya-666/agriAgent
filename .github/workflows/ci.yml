name: AgriAgent CI

on:
  push:
    branches: [ main, "codex/*", "chaitanya/*", "amit/*", "sumant/*", "sahil/*", "worker/*" ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Layered Quality Pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Quality Tooling
        run: |
          python -m pip install --upgrade pip
          # Same versions as requirements-lock.txt, so CI checks what we ship (an unpinned numpy 2.5
          # on Python 3.13 brought stricter type stubs and failed mypy on unchanged code).
          pip install numpy==2.4.6 pillow==12.3.0 pyyaml==6.0.3 pydantic==2.14.1 chromadb==1.5.9 ruff==0.17.1 mypy==2.4.0 streamlit==1.66.0
          pip install -e . --no-deps

      - name: "Layer 1: Linting and Formatting Check"
        run: |
          ruff check .
          ruff format --check .

      - name: "Layer 2: Type Checking and Syntax Verification"
        run: |
          python -m compileall src/ app/ tests/
          mypy --config-file pyproject.toml src/

      - name: "Layer 3: Contract, Unit, and Safety Test Execution"
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest discover tests -v

      - name: "Layer 4: End-to-End Test Suite Execution"
        env:
          PYTHONPATH: .
        run: |
          python3 tests/e2e/runner.py --all

      - name: "Layer 5: Headless Streamlit Smoke Test"
        env:
          PYTHONPATH: .
        run: |
          nohup python -m streamlit run app/app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          sleep 3
          python -c "
          import urllib.request, time
          url = 'http://localhost:8501/_stcore/health'
          for attempt in range(15):
              try:
                  with urllib.request.urlopen(url, timeout=2) as resp:
                      if resp.status == 200:
                          print('Streamlit headless smoke test passed (HTTP 200).')
                          break
              except Exception as e:
                  print(f'Waiting for Streamlit server... ({e})')
                  time.sleep(1)
          else:
              with open('streamlit.log') as f:
                  print(f.read())
              raise RuntimeError('Streamlit health check timed out.')
          "
          kill -TERM $STREAMLIT_PID || true
